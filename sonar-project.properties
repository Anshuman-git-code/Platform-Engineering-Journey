# SonarCloud Project Configuration
# Used by sonar-scanner CLI for static analysis
# Host: https://sonarcloud.io (cloud-hosted, no local server required)

sonar.projectKey=platform-engineering-journey
sonar.organization=platform-engineering-journey
sonar.projectName=Platform Engineering Journey
sonar.projectVersion=1.0

# Source directories to analyse
sonar.sources=api,client/src

# Exclusions — vendored dependencies and build output
# are not application code and must not inflate metrics
sonar.exclusions=**/node_modules/**,client/build/**,client/public/**

# Encoding
sonar.sourceEncoding=UTF-8
