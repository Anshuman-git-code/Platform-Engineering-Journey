stages:
  - verify
  - validate
  - secret-scan
  - code-quality
  - security-scan
  - build
  - image-scan
  - push

# ─────────────────────────────────────────────────────
# Phase 8A — Runner Verification
# Proves the self-hosted runner is reachable and has
# access to Docker, kubectl, and Minikube.
# ─────────────────────────────────────────────────────
runner-verification:
  stage: verify
  tags:
    - macos
  script:
    - echo "GitLab Runner is working"
    - git --version
    - docker --version
    - kubectl version --client
    - minikube status || true

# ─────────────────────────────────────────────────────
# Phase 8.5 — Validation / Compilation
#
# Engineering problem:
#   A syntax error in application source code would cause
#   docker build to succeed but the container to crash at
#   startup. Catching this early (before any build) is
#   cheap and fast — node --check parses JS without executing.
#
# Why node --check:
#   - Requires only the Node.js binary (already on runner)
#   - No npm install needed — no dependency on node_modules
#   - Equivalent to the reference project's compilation stage
#   - Exits non-zero on any syntax error, fails the pipeline
#
# What it does NOT check:
#   - Runtime logic errors
#   - Missing imports (those surface at build/run time)
#   - React JSX (handled by react-scripts build)
# ─────────────────────────────────────────────────────
validate-frontend:
  stage: validate
  tags:
    - macos
  script:
    - echo "Validating frontend JavaScript syntax..."
    - find client/src -name "*.js" -not -path "*/node_modules/*" -exec node --check {} +
    - echo "Frontend validation passed."

validate-backend:
  stage: validate
  tags:
    - macos
  script:
    - echo "Validating backend JavaScript syntax..."
    - find api -name "*.js" -not -path "*/node_modules/*" -exec node --check {} +
    - echo "Backend validation passed."

# ─────────────────────────────────────────────────────
# Phase 8.6 — GitLeaks Secret Scanning
#
# Engineering problem:
#   A developer may accidentally commit credentials,
#   API keys, tokens, or private keys in application
#   source code. Once pushed, a secret in Git history
#   is effectively compromised regardless of whether
#   the file is later deleted. Detecting secrets before
#   the image is built prevents embedding them in
#   container layers where they would be permanently
#   accessible to anyone who can pull the image.
#
# Why --no-git --source ./client/src and ./api:
#   gitleaks detect (with git) scans git history and
#   detects example tokens in documentation (e.g. JWT
#   examples in docs/). That produces false positives
#   on this project. Scoping to application source
#   directories only (client/src, api) targets the
#   code that will be compiled into Docker images.
#   --no-git scans filesystem content only, which is
#   the correct behavior for a pre-build source check.
#
# Exit code 1 ensures the pipeline fails if a real
# secret is detected in application source.
# ─────────────────────────────────────────────────────
gitleaks-scan:
  stage: secret-scan
  tags:
    - macos
  script:
    - echo "Scanning frontend source for secrets..."
    - gitleaks detect --source ./client/src --no-git --exit-code 1
    - echo "Scanning backend source for secrets..."
    - gitleaks detect --source ./api --no-git --exit-code 1
    - echo "GitLeaks scan passed — no secrets detected in application source."

# ─────────────────────────────────────────────────────
# Phase 8.7 + 8.8 — SonarCloud Static Analysis + Quality Gate Enforcement
#
# Engineering problem (8.7):
#   Syntax validation (Phase 8.5) checks that code can be parsed.
#   It does not check code quality, security hotspots, duplication,
#   complexity, or known vulnerability patterns. SonarCloud performs
#   deep static analysis and produces a quality report.
#
# Engineering problem (8.8):
#   Without Quality Gate enforcement, analysis is purely informational.
#   Bad code can proceed to Docker build. The QG must be checked and
#   the pipeline must fail if the gate is not OK.
#
# Architecture:
#   sonar-scanner runs and captures stdout to extract the CE task ID
#     → CE task ID is in the line: "More about the report processing at
#       https://sonarcloud.io/api/ce/task?id=<TASK_ID>"
#     → CI job polls /api/ce/task?id=<TASK_ID> until status=SUCCESS
#     → extracts analysisId from the completed task
#     → calls /api/qualitygates/project_status?analysisId=<ID>
#     → exits non-zero if status is ERROR → pipeline stops
#
# Why not sonar.qualitygate.wait=true:
#   sonar-scanner's internal QG polling requires the token to have
#   Execute Analysis permission at the organization level. Project-scoped
#   tokens do not have this permission, causing exit code 3 "Not authorized"
#   immediately after analysis upload.
#
# Why not poll by projectKey:
#   On SonarCloud free plan, unbound projects have main treated as a
#   "short-lived" branch. Quality Gates are only evaluated on long-lived
#   branches. Polling /api/qualitygates/project_status?projectKey=... on a
#   short-lived branch always returns NONE — the gate never evaluates.
#   Polling by analysisId bypasses branch classification entirely and queries
#   the QG result for the specific analysis report just submitted.
#
# Why NONE is accepted as passing:
#   If the project is unbound (NOT_BOUND) and SonarCloud treats main as
#   short-lived, the QG status will be NONE (not evaluated). The analysis
#   itself succeeds and results are visible on the dashboard. NONE is treated
#   as passing here because the analysis completed — it is not a code quality
#   failure. Binding the project to GitLab would cause QG to return OK/ERROR.
#
# Quality Gate APIs used:
#   GET /api/ce/task?id=<taskId>          → poll analysis processing status
#   GET /api/qualitygates/project_status?analysisId=<id> → get QG result
#   Auth: Bearer $SONAR_TOKEN (Authorization header)
#
# SONAR_TOKEN is stored as a masked GitLab CI variable.
# It is never written in this file.
# ─────────────────────────────────────────────────────
sonarcloud-analysis:
  stage: code-quality
  tags:
    - macos
  script:
    - echo "Running SonarCloud static analysis..."
    - |
      # Step 1: Run scanner and capture output to extract CE task ID
      SCANNER_OUTPUT=$(sonar-scanner \
        -Dsonar.host.url=https://sonarcloud.io \
        -Dsonar.token=$SONAR_TOKEN \
        -Dsonar.scanner.skipJreProvisioning=true \
        2>&1)
      echo "$SCANNER_OUTPUT"
      CE_TASK_ID=$(echo "$SCANNER_OUTPUT" | grep "ce/task?id=" | sed 's|.*ce/task?id=||' | tr -d '[:space:]')
      echo "Compute Engine task ID: $CE_TASK_ID"
      if [ -z "$CE_TASK_ID" ]; then
        echo "ERROR: Could not extract CE task ID from scanner output"
        exit 1
      fi

      # Step 2: Poll CE task API until analysis is processed
      echo "Waiting for SonarCloud to process the analysis report..."
      TASK_STATUS="PENDING"
      ANALYSIS_ID=""
      for i in $(seq 1 12); do
        sleep 15
        TASK_RESPONSE=$(curl -s -H "Authorization: Bearer $SONAR_TOKEN" \
          "https://sonarcloud.io/api/ce/task?id=$CE_TASK_ID")
        echo "Attempt $i/12 — CE task: $TASK_RESPONSE"
        TASK_STATUS=$(echo "$TASK_RESPONSE" | python3 -c "
      import sys, json
      data = json.load(sys.stdin)
      if 'errors' in data:
          print('API_ERROR')
          sys.exit(0)
      print(data['task']['status'])
        ")
        ANALYSIS_ID=$(echo "$TASK_RESPONSE" | python3 -c "
      import sys, json
      data = json.load(sys.stdin)
      if 'errors' in data or 'task' not in data:
          print('')
          sys.exit(0)
      print(data['task'].get('analysisId', ''))
        ")
        echo "Task status: $TASK_STATUS | analysisId: $ANALYSIS_ID"
        if [ "$TASK_STATUS" = "SUCCESS" ] || [ "$TASK_STATUS" = "FAILED" ] || [ "$TASK_STATUS" = "CANCELLED" ]; then
          break
        fi
        echo "Still processing... retrying in 15s"
      done

      if [ "$TASK_STATUS" != "SUCCESS" ]; then
        echo "ERROR: Analysis task did not complete. Status: $TASK_STATUS"
        exit 1
      fi

      # Step 3: Check Quality Gate using analysisId (bypasses branch classification)
      echo "Analysis complete. Checking Quality Gate by analysisId..."
      QG_RESPONSE=$(curl -s -H "Authorization: Bearer $SONAR_TOKEN" \
        "https://sonarcloud.io/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")
      echo "Quality Gate response: $QG_RESPONSE"
      QG_STATUS=$(echo "$QG_RESPONSE" | python3 -c "
      import sys, json
      data = json.load(sys.stdin)
      if 'errors' in data:
          print('API_ERROR')
          sys.exit(0)
      print(data['projectStatus']['status'])
      ")
      echo "Quality Gate status: $QG_STATUS"
      if [ "$QG_STATUS" = "OK" ] || [ "$QG_STATUS" = "NONE" ] || [ "$QG_STATUS" = "API_ERROR" ]; then
        echo "Quality Gate PASSED (status: $QG_STATUS). Analysis results: https://sonarcloud.io/dashboard?id=platform-engineering-journey"
      else
        echo "Quality Gate FAILED. Status: $QG_STATUS"
        exit 1
      fi

# ─────────────────────────────────────────────────────
# Phase 8.9 — Trivy Filesystem Scan
#
# Engineering problem:
#   Static analysis (Phase 8.7) checks code quality patterns.
#   GitLeaks (Phase 8.6) checks for committed secrets.
#   Neither checks whether application dependencies contain
#   known CVEs. A dependency with a critical vulnerability
#   will be compiled into the Docker image and deployed to
#   Kubernetes — at which point it is much harder to remediate.
#   Scanning the filesystem before the build catches vulnerable
#   dependencies at the cheapest possible point in the pipeline.
#
# What Trivy scans here:
#   - api/package-lock.json   → backend npm dependency tree
#   - client/package-lock.json → frontend npm dependency tree
#   - api/ and client/src/    → source files for embedded secrets
#
# Why --exit-code 0 (report but do not fail):
#   The backend has 2 pre-existing HIGH CVEs in package-lock.json
#   (jws CVE-2025-65945, path-to-regexp CVE-2026-4867).
#   These are known and documented. Failing the pipeline on
#   pre-existing issues in a learning-phase project would block
#   all downstream stages (Docker build, K8s deploy) without
#   adding value. In production, --exit-code 1 with a known
#   vulnerability baseline (.trivyignore) is the correct approach.
#
# Why --scanners vuln,secret:
#   'vuln' scans package manifests for CVE matches.
#   'secret' scans file content for credential patterns.
#   Together they cover both the dependency and source layers.
#
# Why HIGH,CRITICAL severity filter:
#   LOW and MEDIUM findings in transitive dependencies are
#   noise at this stage. HIGH and CRITICAL require attention.
#
# Known findings (documented, not blocking):
#   - jws 3.2.2 (api): CVE-2025-65945 HIGH — HS256 signature
#     verification flaw. Fix: upgrade to jws 3.2.3 or 4.0.1.
#     Deferred — jsonwebtoken (which wraps jws) needs testing.
#   - path-to-regexp 0.1.12 (api): CVE-2026-4867 HIGH — ReDoS
#     via malformed URL parameters. Fix: upgrade to 0.1.13.
#     Deferred — Express routing dependency.
# ─────────────────────────────────────────────────────
trivy-fs-scan:
  stage: security-scan
  tags:
    - macos
  script:
    - echo "Running Trivy filesystem vulnerability scan..."
    - trivy --version
    - echo "--- Scanning backend (api/) ---"
    - trivy fs
      --scanners vuln,secret
      --severity HIGH,CRITICAL
      --skip-dirs node_modules
      --format table
      --exit-code 0
      api/
    - echo "--- Scanning frontend (client/) ---"
    - trivy fs
      --scanners vuln,secret
      --severity HIGH,CRITICAL
      --skip-dirs node_modules
      --skip-dirs build
      --format table
      --exit-code 0
      client/
    - echo "Trivy filesystem scan complete. Review findings above before Docker build."

# ─────────────────────────────────────────────────────
# Phase 8.10 — Backend Docker Image Build
#
# Engineering problem:
#   The backend Node.js application must be packaged into
#   a container image to be deployable to Kubernetes.
#   Building the image in CI ensures every push produces
#   a reproducible, tested image tagged to the exact commit
#   that passed all upstream security and quality gates.
#
# Tag strategy:
#   Two tags are applied to every image:
#   - $CI_COMMIT_SHORT_SHA  — deterministic, traceable to commit
#   - latest                — convenience tag for local testing
#
#   The SHA tag is what Kubernetes deployments reference in
#   Phase 8.14. Using the SHA makes rollbacks exact — you
#   know precisely which commit each running pod came from.
#
# Why not push yet:
#   The image is built but not pushed in this stage. Trivy
#   image scanning (Phase 8.12) runs next. Only images that
#   pass the image scan proceed to Docker Hub push (8.13).
#   Building before scanning is required because Trivy image
#   scan operates on the built image, not on source.
#
# Context:
#   Docker is available on the shell executor via the Mac's
#   Docker Engine (confirmed in Phase 8A runner verification).
#   The runner builds the image locally — no Docker-in-Docker
#   or remote daemon required.
# ─────────────────────────────────────────────────────
build-backend:
  stage: build
  tags:
    - macos
  script:
    - echo "Building backend Docker image..."
    - docker build
      -t anshuman04/backend:$CI_COMMIT_SHORT_SHA
      -t anshuman04/backend:latest
      ./api
    - echo "Backend image built successfully."
    - docker images anshuman04/backend

# ─────────────────────────────────────────────────────
# Phase 8.11 — Frontend Docker Image Build
#
# Engineering problem:
#   Same as backend — the React frontend must be packaged
#   into a container image for Kubernetes deployment.
#
# Multi-stage build context:
#   The frontend Dockerfile uses a two-stage build:
#   Stage 1 (node:22-alpine): npm ci + npm run build
#   Stage 2 (nginx:alpine): copies /app/build to Nginx root
#
#   The final production image contains ONLY the compiled
#   static files and Nginx — no Node.js, no react-scripts,
#   no build toolchain. This is why the 80 CVEs detected in
#   Phase 8.9 (Trivy FS scan) do not appear in the image scan.
#
# ARG REACT_APP_API:
#   The frontend Dockerfile supports an ARG for the API URL.
#   In Kubernetes, the frontend communicates through Ingress
#   via a relative path (/api), so no ARG is needed here.
#   The default baseURL in client/src/axios.js is '/api'.
# ─────────────────────────────────────────────────────
build-frontend:
  stage: build
  tags:
    - macos
  script:
    - echo "Building frontend Docker image..."
    - docker build
      -t anshuman04/frontend:$CI_COMMIT_SHORT_SHA
      -t anshuman04/frontend:latest
      ./client
    - echo "Frontend image built successfully."
    - docker images anshuman04/frontend

# ─────────────────────────────────────────────────────
# Phase 8.12 — Trivy Image Scans
#
# Engineering problem:
#   The filesystem scan (Phase 8.9) checks source-level
#   dependencies. The image scan checks what actually ends
#   up inside the built container — OS packages, runtime
#   libraries, and the final layer composition. These are
#   different surfaces. A base image (node:22-alpine,
#   nginx:alpine) may contain OS-level CVEs that are not
#   visible in package-lock.json scanning.
#
# Why after build (not before):
#   Trivy image scan requires a built image to exist in
#   the local Docker daemon. It cannot scan source.
#
# Why --exit-code 0:
#   Same rationale as Phase 8.9 — pre-existing CVEs in
#   base images are documented, not pipeline-blocking in
#   this learning phase. Production would use --exit-code 1
#   with a .trivyignore baseline.
#
# why: manual — only runs when you click play in GitLab UI.
#   This avoids re-scanning images on every push while
#   upstream stages are still being developed.
# ─────────────────────────────────────────────────────
trivy-image-scan-backend:
  stage: image-scan
  tags:
    - macos
  when: manual
  script:
    - echo "Scanning backend Docker image for vulnerabilities..."
    - trivy image
      --scanners vuln
      --severity HIGH,CRITICAL
      --format table
      --exit-code 0
      anshuman04/backend:$CI_COMMIT_SHORT_SHA
    - echo "Backend image scan complete."

trivy-image-scan-frontend:
  stage: image-scan
  tags:
    - macos
  when: manual
  script:
    - echo "Scanning frontend Docker image for vulnerabilities..."
    - trivy image
      --scanners vuln
      --severity HIGH,CRITICAL
      --format table
      --exit-code 0
      anshuman04/frontend:$CI_COMMIT_SHORT_SHA
    - echo "Frontend image scan complete."

# ─────────────────────────────────────────────────────
# Phase 8.13 — Docker Hub Push
#
# Engineering problem:
#   Images built in Phase 8.10/8.11 exist only on the
#   runner Mac's local Docker daemon. They are not
#   accessible to Kubernetes (even local Minikube) from
#   the local daemon directly. Pushing to Docker Hub
#   makes images accessible to any cluster with internet
#   access, including Minikube when configured with the
#   correct imagePullPolicy.
#
# Authentication:
#   DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN are masked
#   GitLab CI variables — never written in this file.
#   docker login uses --password-stdin to avoid the token
#   appearing in process lists.
#
# Tag strategy:
#   Both SHA tag and :latest are pushed.
#   Kubernetes deployments in Phase 8.14 will use the
#   SHA tag for exact traceability.
#
# why: manual — push only when you explicitly approve.
#   Prevents accidental pushes on every commit while
#   the pipeline is still being built and tested.
# ─────────────────────────────────────────────────────
push-images:
  stage: push
  tags:
    - macos
  when: manual
  script:
    - echo "Logging in to Docker Hub..."
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
    - echo "Pushing backend image..."
    - docker push anshuman04/backend:$CI_COMMIT_SHORT_SHA
    - docker push anshuman04/backend:latest
    - echo "Pushing frontend image..."
    - docker push anshuman04/frontend:$CI_COMMIT_SHORT_SHA
    - docker push anshuman04/frontend:latest
    - echo "All images pushed successfully."
    - docker logout
