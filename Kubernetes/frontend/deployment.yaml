apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: prod
  labels:
    app: frontend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: anshuman04/frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80
          # ─────────────────────────────────────────────
          # Resource Requests + Limits (Phase 9.3 + 9.4)
          #
          # Frontend is nginx:alpine serving static files.
          # CPU usage is minimal — only during TLS/gzip.
          # Memory footprint is tiny — no Node.js at runtime.
          # 3 replicas × 32Mi = 96Mi total for all frontend pods.
          # ─────────────────────────────────────────────
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"