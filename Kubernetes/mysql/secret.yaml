# mysql-secret — stores sensitive MySQL credentials
# Values are base64-encoded
# Generate: echo -n 'your-value' | base64
#
# This file should NOT be committed with real values.
# Use a secrets manager or sealed-secrets in production.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: prod
type: Opaque
data:
  password: <base64-encoded-password>   # DB_PASSWORD for backend
  root-password: <base64-encoded-password>  # MYSQL_ROOT_PASSWORD
