apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: crud-app-ingress
  namespace: prod

spec:
  ingressClassName: nginx

  rules:
    - host: crud.local

      http:

        paths:

          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend
                port:
                  number: 80

          - path: /api
            pathType: Prefix

            backend:
              service:
                name: backend
                port:
                  number: 5000