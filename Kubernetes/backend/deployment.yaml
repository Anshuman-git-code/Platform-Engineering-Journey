apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: prod
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: anshuman04/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          # ─────────────────────────────────────────────
          # Readiness Probe (Phase 9.1)
          # Kubernetes polls /health every 10s after an
          # initial 15s delay. The pod is only added to
          # the Service endpoint list when this returns 200.
          # Until then, no traffic is routed to this pod.
          # failureThreshold: 3 means 3 consecutive failures
          # before the pod is marked NotReady.
          # ─────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          # ─────────────────────────────────────────────
          # Liveness Probe (Phase 9.2)
          # After the pod is running, Kubernetes polls /health
          # every 20s. If 3 consecutive checks fail, the
          # container is killed and restarted automatically.
          # initialDelaySeconds is higher than readiness to
          # avoid killing the pod during normal startup.
          # ─────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          # ─────────────────────────────────────────────
          # Resource Requests + Limits (Phase 9.3 + 9.4)
          #
          # Requests: minimum guaranteed resources.
          # The scheduler uses these to find a node with
          # enough available capacity. The pod is never
          # placed on a node that cannot satisfy requests.
          #
          # Limits: maximum allowed resources.
          # If the container exceeds memory limit → OOMKilled.
          # If it exceeds CPU limit → throttled (not killed).
          #
          # Values chosen for Minikube (2 CPU, 6GB RAM):
          #   Backend is a Node.js API — lightweight at rest,
          #   needs headroom for concurrent JWT + DB operations.
          # ─────────────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
            - name: RESET_ADMIN_PASS
              value: "true"
